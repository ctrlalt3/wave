name: Wave
options:
  bundleIdPrefix: app.wave
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
schemes:
  Wave:
    build:
      targets:
        Wave: all
    test:
      targets: [WaveTests]
targets:
  Wave:
    type: application
    platform: iOS
    sources: [Wave]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wave.music.ios
        MARKETING_VERSION: '0.6.6'
        CURRENT_PROJECT_VERSION: '12'
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Wave
        NSAppleMusicUsageDescription: Wave necesita acceso para mostrar y reproducir las canciones, álbumes y playlists de tu biblioteca de Música.
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  WaveTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WaveTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Wave
